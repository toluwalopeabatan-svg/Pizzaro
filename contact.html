<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="contact" content="contact pizzaro with any questions or concerns">
    <title>Contact Pizzaro</title>
    <link rel="icon" type="image/x-icon" href="img/pizza.icon.jpg">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Contact Pizzaro</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About Pizzaro</a></li>
                <li><a href="index.html#menu">Our Menu</a></li>
                <li><a href="storehours.html">Store Hours</a></li>
            </ul>
        </nav>
        <figure>
            <img src="img/pizza3.jpg" alt="pizza image" title="Pizzaro" width="300" height="300">
            <figcaption>always ready to serve you</figcaption>
        </figure>
    </header>
    <main>
        <section>
            <h2>Our Contact Form</h2>
            <form action="https://httpbin.org/post" method="post">
                <fieldset>
                    <legend>Send us a message</legend>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                    <br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Your email" required>
                    <br>
                    <label for="message">Your Message:</label><br>
                    <textarea id="message" name="message" placeholder="Your message" required></textarea>
                </fieldset>
                <br>
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </form>
        </section>
        <section>
            <h2>Contact Us</h2>
            <address>
                <p>Pizzaro Headquarters</p>
                <p>123 Pizza Street</p>
                <p>Pizza City, PC 12345</p>
                <p>Phone: <a href="tel:+2345678902345">+234 567 890 2345</a></p>
                <a href="#">Back to Top</a>
            </address>
            <hr>
        </section>
    </main>
    <footer>
        <P>&lt;&lt;&lt;&copy;Prince Tolzy&gt;&gt;&gt;</P>
    </footer>
</body>

</html>
